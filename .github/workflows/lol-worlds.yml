name: LoL Worlds refresh

# Re-reads this year's Worlds series from Leaguepedia's Cargo API into the LoL Stats
# seeds tab (webapp/public/data/lol-worlds.json), commits it to main and dispatches the
# Pages deploy (a GITHUB_TOKEN push triggers no workflow on its own).
#
# DAILY through October and November, which is when Worlds is played (2026: Oct 15 -
# Nov 14), and a no-op once this year's bracket is complete (`worlds.py due`). A run makes
# ONE request (the current year; settled years come from the cache), at most a few if the
# cache is cold. A series still being played, or not yet drawn, is left out until a later
# run has its winner; a run that finds nothing new commits nothing and deploys nothing.
#
# WHY DAILY, AND WHY 75 IS GREEN: a runner's IP is shared with everyone else's jobs, and a
# site that has had enough of that IP says so (Liquipedia, the old source, IP-blocked the
# 2026-11-16 run with HTTP 429 on its first request). polite.py backs off within a budget
# and then exits 75; that stays GREEN while another day remains (the next run gets another
# runner and IP), and only Nov 30's, the last chance, goes red. A run by hand always fails
# on it.
#
# ONE HAND STEP A YEAR, once the field is known (late September): add the year to SEEDS
# in lolstats/tools/worlds.py and to SEED_YEARS in lolstats/derive.js. Until then this
# fails and says so, which is the reminder.

#
# THE DATA STORE (data-worker/, root CLAUDE.md "THE DATA STORE"): with vars.DATA_URL set
# this job starts from the store's copy of what it builds on, uploads what it changed,
# and the pages read it from there. vars.DATA_COMMITS=off stops the commit + deploy.
on:
  schedule:
    - cron: "31 9 * 10,11 *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: lol-worlds
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      # The data store's copy is what the build must start from (data-worker/datastore.py),
      # and what tells `due` whether this year's bracket is already complete.
      - name: Take the published files
        env:
          DATA_URL: ${{ vars.DATA_URL }}
        run: python data-worker/datastore.py take lol-worlds.json
      - name: Due
        id: due
        env:
          EVENT: ${{ github.event_name }}
        run: python -I lolstats/tools/worlds.py due "$(date -u +%Y)"
      - uses: actions/cache/restore@v4
        if: steps.due.outputs.due == 'true'
        with:
          path: lolstats/tools/cache/worlds
          key: lol-worlds-lp-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: lol-worlds-lp-
      - name: Fetch this year's pages
        id: fetch
        if: steps.due.outputs.due == 'true'
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set +e
          python -I lolstats/tools/worlds.py fetch "$(date -u +%Y)"
          code=$?
          set -e
          if [ "$code" = 75 ]; then
            if [ "$EVENT" = schedule ] && [ "$(date -u +%m%d)" != 1130 ]; then
              echo "::warning::the source asked us to stop for today (a block or a rate limit; the notice above says which); tomorrow's run gets another runner and tries again (the last is Nov 30)"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::the source asked us to stop for today (a block or a rate limit), and no scheduled run is left this year"
          fi
          exit "$code"
      - uses: actions/cache/save@v4
        if: steps.due.outputs.due == 'true' && steps.fetch.outputs.skip != 'true'
        with:
          path: lolstats/tools/cache/worlds
          key: lol-worlds-lp-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Build the payload
        if: steps.due.outputs.due == 'true' && steps.fetch.outputs.skip != 'true'
        run: python -I lolstats/tools/worlds.py build
      - name: Publish to the data store
        if: steps.due.outputs.due == 'true' && steps.fetch.outputs.skip != 'true'
        env:
          DATA_URL: ${{ vars.DATA_URL }}
          DATA_PUBLISH_TOKEN: ${{ secrets.DATA_PUBLISH_TOKEN }}
        run: python data-worker/datastore.py publish lol-worlds.json
      - name: Commit and deploy
        if: vars.DATA_COMMITS != 'off' && steps.due.outputs.due == 'true' && steps.fetch.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add webapp/public/data/lol-worlds.json
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "LoL Stats: Worlds $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push origin HEAD:main
          gh workflow run deploy-pages.yml --ref main
