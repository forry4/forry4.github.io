name: Steam Filter prices

# Re-reads today's Steam and US eShop prices (and the sales running) for every game
# in the Steam Filter payload into steam-prices.json. ~2 minutes: ~90 Steam requests
# and ~40 eShop searches.
#
# Twice a day, because GitHub drops a good share of scheduled firings (CLAUDE.md,
# keep-alive) and sales start at both ends of the day: the eShop's at 07:00 or 16:00
# UTC, Steam's at 17:00. The page never shows a sale past its end, so a missed run
# leaves a sale that started unshown, never an ended one shown.
#
# WHERE THE FILE GOES — two destinations, switched by repo settings, so the move off
# commits is an expand/contract and never a flag day:
#
#   vars.DATA_URL set     -> PUT to the data store (data-worker/, Workers KV). The page reads
#                            it within minutes: no commit, no Pages build.
#   vars.DATA_COMMITS     -> anything but "off" (the default): ALSO commit to main and
#                            deploy, as before. Set it to "off" once the site is
#                            reading the store, and the commits stop.
#
# With neither set this is the old job, byte for byte in behaviour.
#
# prices.py leaves the file untouched when no price moved, so a quiet run uploads and
# commits nothing. It BUILDS ON THE PREVIOUS FILE (a Steam sale's start is the run that
# first saw it, carried forward), so with the store on, the previous file is the
# store's — once commits are off the checkout's copy is stale. A push made with
# GITHUB_TOKEN does not trigger other workflows, so the job dispatches the deploy.

on:
  schedule:
    - cron: "17 8 * * *"
    - cron: "43 17 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: steam-prices
  cancel-in-progress: false

jobs:
  prices:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      # The data store's copy is what the build must start from (data-worker/datastore.py).
      - name: Take the published files
        env:
          DATA_URL: ${{ vars.DATA_URL }}
        run: python data-worker/datastore.py take steam-prices.json steam-filter.json
      - name: Read prices
        run: python -u steamfilter/tools/prices.py
      - name: Publish to the data store
        env:
          DATA_URL: ${{ vars.DATA_URL }}
          DATA_PUBLISH_TOKEN: ${{ secrets.DATA_PUBLISH_TOKEN }}
        run: python data-worker/datastore.py publish steam-prices.json
      - name: Commit and deploy
        if: vars.DATA_COMMITS != 'off'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add webapp/public/data/steam-prices.json
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "Steam Filter: prices $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push origin HEAD:main
          gh workflow run deploy-pages.yml --ref main
