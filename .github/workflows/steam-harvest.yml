name: Steam Filter harvest

# Re-collects webapp/public/data/steam-filter.json from the Steam store and
# commits it to main. Manual only ("Run workflow"): a harvest is ~1-2 hours of
# polite requests, and the list moves slowly enough that a refresh every month
# or two is plenty.
#
# A push made with GITHUB_TOKEN does not trigger other workflows, so the job
# dispatches the Pages deploy itself once the data is on main.

on:
  workflow_dispatch:
    inputs:
      min_reviews:
        description: 'English-review floor for the dataset'
        default: '50'
      round:
        description: 'Continuation round (set by the workflow itself; leave at 1)'
        default: '1'

permissions:
  contents: write
  actions: write

concurrency:
  group: steam-harvest
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      # Every Steam answer is cached as it arrives, and the cache is saved even when
      # the harvest fails or hits its step timeout, so "Run workflow" again resumes
      # where the last run stopped (answers younger than 48h are reused).
      - uses: actions/cache/restore@v4
        with:
          path: steamfilter/tools/cache
          key: steam-harvest-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: steam-harvest-
      - name: Harvest
        id: harvest
        # A step timeout, not the job's: the job must outlive it to save the cache.
        # Measured 2026-10-15: search ~68 min (132k games), then ~60 review lookups a
        # minute against ~22k candidates — ~7h in all, more than one job may run.
        timeout-minutes: 320
        run: python -u steamfilter/tools/scan_steam.py --min-reviews "${{ inputs.min_reviews }}"
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: steamfilter/tools/cache
          key: steam-harvest-${{ github.run_id }}-${{ github.run_attempt }}
      # Out of time (or a transient failure): the cache is saved above, so start the
      # next round, which reuses every answer already collected. Capped at 3 rounds.
      - name: Continue in a new run
        if: always() && steps.harvest.outcome != 'success' && fromJSON(inputs.round) < 3
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run steam-harvest.yml --ref main \
            -f min_reviews="${{ inputs.min_reviews }}" -f round="$(( ${{ inputs.round }} + 1 ))"
      - name: Build the payload
        run: python steamfilter/tools/make_data.py
      - name: Commit and deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add webapp/public/data/steam-filter.json
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "Steam Filter: harvest $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push origin HEAD:main
          gh workflow run deploy-pages.yml --ref main
