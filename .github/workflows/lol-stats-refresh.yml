name: LoL Stats refresh

# Re-downloads Oracle's Elixir match data and rebuilds LoL Stats' champion payload
# (webapp/public/data/lol-champs-<year>.json + the index), then commits it to main.
#
# Monthly on the 15th, January through November: the pro season runs from January to
# Worlds (2026's final: Nov 14), and nothing is played in December. A scheduled run
# rebuilds the current year; January's also rebuilds the year before, which picks up
# the games played after November's run. Oracle's Elixir posts a year's file with its
# first games, so a January run before that skips the new year rather than failing.
# "Run workflow" rebuilds any years named (blank = the current year).
#
# The Worlds seeds tab (lol-worlds.json) is lol-worlds.yml, from Liquipedia.
#
# A push made with GITHUB_TOKEN does not trigger other workflows, so the job
# dispatches the Pages deploy itself once the data is on main.

on:
  schedule:
    - cron: "23 10 15 1-11 *"
  workflow_dispatch:
    inputs:
      years:
        description: 'Years to rebuild, space-separated (blank = the current year)'
        default: ''

permissions:
  contents: write
  actions: write

concurrency:
  group: lol-stats-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      # The input reaches the shell through env, never pasted into the script.
      - name: Download
        env:
          YEARS: ${{ inputs.years }}
        run: |
          y=$(date -u +%Y)
          if [ -n "$YEARS" ]; then python -I lolstats/tools/harvest.py $YEARS
          elif [ "$(date -u +%m)" = 01 ]; then python -I lolstats/tools/harvest.py --skip-missing $((y - 1)) $y
          else python -I lolstats/tools/harvest.py $y
          fi
      # Every CSV downloaded above, and only those (the runner starts with none).
      - name: Build the payload
        run: python -I lolstats/tools/make_data.py
      - name: Commit and deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add webapp/public/data/lol-champs-*.json
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "LoL Stats: refresh $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push origin HEAD:main
          gh workflow run deploy-pages.yml --ref main
