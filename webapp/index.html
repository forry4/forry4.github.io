<!doctype html>
<!-- lang: without it a screen reader picks its voice from the OS language (English
     read with another language's pronunciation), and browsers have nothing to base
     hyphenation or the "translate this page?" offer on. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- What a search result or a pasted link shows under the title. An invite link
         is this site's whole sharing story, and it used to unfurl as a bare URL. -->
    <meta name="description" content="Forrest Games: a collection of tabletop games to play in the browser with friends or against AI opponents." />
    <meta property="og:title" content="Forrest Games" />
    <meta property="og:description" content="A collection of tabletop games to play in the browser with friends or against AI opponents." />
    <meta property="og:type" content="website" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <!-- Warm the Render backend as early as possible (before the bundle even loads) so its
         cold start (~30-50s; free tier spins down after ~15 min idle) overlaps page load
         instead of blocking the first real request. Fire-and-forget; prod hosts only, so
         local dev never pings prod. A daytime cron (.github/workflows/keepalive.yml) keeps
         it warm during play hours; this covers off-hours visitors. -->
    <script>
      (function () {
        try {
          var h = location.hostname;
          if (h === "forry4.github.io" || h.slice(-11) === ".workers.dev") {
            fetch("https://splendid-nelz.onrender.com/health", { mode: "no-cors", cache: "no-store" }).catch(function () {});
          }
        } catch (e) {}
      })();
    </script>
    <!-- favicon / bookmark icon. %BASE_URL% expands to the Vite build base (/ for the
         forry4.github.io root site; overridable via VITE_BASE), so the path stays
         correct under any base. Files live in webapp/public/. -->
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%favicon-32.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <!-- PWA: installable to a phone home screen. The manifest + a service worker
         (registered in shared/pwa.js, prod hosts only) make the site "Add to Home
         Screen"-able; the iOS meta tags give it a standalone, fullscreen launch
         (Safari ignores the manifest's display mode). theme-color matches the
         inline dark bg below so the status bar / task-switcher chrome blends in. -->
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <meta name="theme-color" content="#0f0e0c" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Forrest Games" />
    <!-- Preload the self-hosted fonts (same-origin, in webapp/public/fonts/) so they're
         ready at first paint and the app's font-load gate resolves instantly — no external
         Google Fonts round-trip. @font-face lives in baseCss (display:optional); metric-
         matched Georgia fallbacks (in baseCss) keep layout stable if a font isn't ready.
         crossorigin is required even same-origin (fonts fetch in CORS mode). The inline
         dark bg avoids a white flash before the JS CSS loads. -->
    <link rel="preload" as="font" type="font/woff2" href="%BASE_URL%fonts/cinzel.latin.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="%BASE_URL%fonts/crimsonpro.latin.woff2" crossorigin />
    <!-- ALL THREE faces must be here. display:optional means a face that isn't ready
         within its ~100ms block period is dropped for the WHOLE page load — no swap
         when it lands. The italic was the one face left un-preloaded, so it started
         at first paint and finished after it (measured on prod: 6-264ms late on
         every profile, cached and cold), and every italic on the site — hints,
         empty states, log lines — rendered in Georgia italic, which is markedly
         heavier than Crimson Pro's 300-400. It corrected itself on reload, once
         the font was cached: exactly the "thicker font until I reload" report. -->
    <link rel="preload" as="font" type="font/woff2" href="%BASE_URL%fonts/crimsonpro-italic.latin.woff2" crossorigin />
    <style>html,body{margin:0;background:#0f0e0c}</style>
    <title>Forrest Games</title>
  </head>
  <body>
    <noscript>
      <p style="color:#f3e9d2;font:16px/1.5 Georgia,serif;padding:32px;max-width:36em;margin:0 auto">
        Forrest Games needs JavaScript to run. Turn it on for this site and reload the page.
      </p>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/main.jsx"></script>
  </body>
</html>
