name: Keep backend warm

# The WATCHDOG for the keepalive. The warming itself is the Cloudflare Worker in
# keepalive-worker/ (every 5 minutes, 11:00-09:59 UTC). This workflow used to warm
# too — ~20 schedules a day, each holding a retrying curl open for 90 minutes —
# but once the Worker was deployed those holds only duplicated it from a scheduler
# that drops over half its firings, so they were removed (2026-11-14).
#
# What is left is what nothing else checks, twice a day, ~12h apart: /health
# answers (a transient failure is recovered first, and only a failure that lasts
# the whole four-minute recovery window is red), and the Worker still answers. A
# Worker that disappears fails SILENTLY — the site just goes back to cold starts —
# so this job is how anyone finds out. A run GitHub delivers outside the warm
# window exits green without pinging (keepalive.py): the window is Render's
# instance-hour budget. See docs/keepalive-reliability.md.

permissions:
  contents: read

env:
  HEALTH_URL: https://splendid-nelz.onrender.com/health
  # The warmer itself (keepalive-worker/). The watchdog checks it still answers.
  WORKER_URL: https://forrestgames-keepalive.forry4.workers.dev/

on:
  schedule:
    - cron: "47 5 * * *"           # 22:47 PDT / 21:47 PST
    - cron: "47 17 * * *"          # 10:47 PDT / 09:47 PST
  workflow_dispatch: {}

jobs:
  warm-window-watchdog:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Verify backend health and recover if needed
        run: python3 .github/scripts/keepalive.py
      # Red whenever the Worker does not answer: until 2026-11-13 it had never been
      # deployed, and nothing said so. Redeploy: `npx wrangler deploy --config
      # keepalive-worker/wrangler.jsonc` (the owner's Cloudflare login), or the
      # deploy-keepalive-worker.yml workflow.
      - name: Verify the Cloudflare keepalive Worker is deployed
        if: ${{ !cancelled() }}
        run: python3 .github/scripts/keepalive.py --check-worker "$WORKER_URL"
