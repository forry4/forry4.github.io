name: Python CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          # The Render deploy gate waits for this exact run on main, so keep
          # dependency installation cheap without changing the test boundary.
          cache: pip
          cache-dependency-path: games/spender/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r games/spender/requirements.txt
      - name: Run tests
        # Bare pytest — the suite is defined by `testpaths` in pytest.ini. This
        # list used to omit games/spender_duel/tests/ (present in the Render
        # deploy gate), so Duel's tests never ran on a push or PR.
        run: |
          set -o pipefail
          python -m pytest -q -rf 2>&1 | tee "$RUNNER_TEMP/pytest.log"

      # A red suite here is often one a dev box cannot reproduce — this runner is
      # Linux on Python 3.11 while local work happens on Windows on 3.14 — and the
      # job log needs repository ADMIN to download through the API. The step
      # summary is part of the check run's public output, so putting the failing
      # tail here is the difference between diagnosing a break and guessing at it.
      - name: Report the failures
        if: failure()
        run: |
          # Both the step summary and the job log need repository admin to read
          # back through the API; ::error:: workflow commands become check-run
          # ANNOTATIONS, which are public. That is the only channel that gets a
          # failing test name to someone who cannot open the log.
          {
            echo '### Failing tests'
            echo '```'
            grep -E '^(FAILED|ERROR)' "$RUNNER_TEMP/pytest.log" | head -40 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -E '^(FAILED|ERROR)' "$RUNNER_TEMP/pytest.log" | head -20 | while IFS= read -r line; do
            echo "::error::$line"
          done
          tail -25 "$RUNNER_TEMP/pytest.log" | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}' | {
            read -r blob
            echo "::error::pytest tail%0A$blob"
          }
