name: Anime Filter harvest

# Re-collects the Anime Filter data from AniList, MyAnimeList (Jikan) and Kitsu.
# Manual only ("Run workflow"): ~20-40 minutes of polite requests, and ratings move
# slowly enough that a refresh every month or two is plenty. Runs on a runner
# because those APIs are not reachable from the dev container.
#
# The RAW harvest (results_all.json) is force-pushed to the `anime-harvest` branch,
# so make_data.py can be re-tuned locally without asking the sites again
# (`git fetch origin anime-harvest && git show origin/anime-harvest:results_all.json.gz`).
# With publish=true the payload is also rebuilt and committed to main, and the
# Pages deploy dispatched (a GITHUB_TOKEN push triggers no workflow on its own).

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Rebuild webapp/public/data/anime-filter.json and commit it to main'
        type: boolean
        default: true
      probe_only:
        description: 'Only probe the sites (prints DNS, status codes and sample markup), no harvest'
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: anime-harvest
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      # Every answer is cached as it arrives and the cache is saved even when the
      # harvest fails, so "Run workflow" again resumes where the last run stopped.
      - uses: actions/cache/restore@v4
        with:
          path: animefilter/tools/cache
          key: anime-harvest-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: anime-harvest-
      # What each host resolves to and whether it answers — printed so a harvest that
      # cannot reach a site says which and how, before the long run starts.
      - name: Probe the sites
        continue-on-error: true
        run: |
          for h in graphql.anilist.co api.jikan.moe kitsu.io myanimelist.net api.myanimelist.net; do
            echo "== $h"; getent ahosts "$h" | awk '{print $1}' | sort -u | head -4
            curl -s -o /dev/null -m 20 -w "  v4: %{http_code} %{remote_ip}\n" -4 "https://$h/" || echo "  v4: failed"
            curl -s -o /dev/null -m 20 -w "  v6: %{http_code} %{remote_ip}\n" -6 "https://$h/" || echo "  v6: failed"
          done
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130 Safari/537.36"
          curl -s -m 30 -A "$UA" "https://myanimelist.net/topanime.php?limit=0" -o /tmp/top.html -w "topanime: %{http_code} %{size_download}\n"
          grep -o -E 'class="ranking-list".{0,40}|score-label score-[0-9]+">[0-9.]+|[0-9,]+ members|anime/[0-9]+/[^"]{0,40}"' /tmp/top.html | head -12
          curl -s -m 30 -A "$UA" "https://myanimelist.net/anime/16498" -o /tmp/one.html -w "anime page: %{http_code} %{size_download}\n"
          grep -o -E 'itemprop="(ratingValue|ratingCount)"[^>]*>[^<]*|Members:</span>[^<]{0,30}|English:</span>[^<]{0,60}|Demographic:</span>.{0,160}|class="score-label[^>]*>[^<]*' /tmp/one.html | head -12
          curl -s -m 30 -A "$UA" "https://kitsu.io/api/edge/anime?filter%5Bid%5D=7442&fields%5Banime%5D=averageRating,userCount" | head -c 300; echo
      - name: Harvest
        if: ${{ !inputs.probe_only }}
        timeout-minutes: 160
        run: python -u animefilter/tools/harvest.py
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: animefilter/tools/cache
          key: anime-harvest-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Push the raw harvest to the anime-harvest branch
        if: ${{ !inputs.probe_only }}
        run: |
          mkdir -p /tmp/raw && gzip -9 -c animefilter/tools/results_all.json > /tmp/raw/results_all.json.gz
          cd /tmp/raw
          git init -q -b anime-harvest
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results_all.json.gz
          git commit -q -m "Anime Filter raw harvest $(date -u +%Y-%m-%d)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" anime-harvest
      - name: Build the payload
        if: inputs.publish && !inputs.probe_only
        run: python animefilter/tools/make_data.py
      - name: Commit and deploy
        if: inputs.publish && !inputs.probe_only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add webapp/public/data/anime-filter.json
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "Anime Filter: harvest $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push origin HEAD:main
          gh workflow run deploy-pages.yml --ref main
