[pytest]
# SINGLE source of truth for what the suite is. Both CI workflows call a bare
# `pytest`, so the PR gate (python-app.yml) and the Render deploy gate
# (deploy-render.yml) can no longer drift apart — they used to carry two
# hand-maintained path lists, and `games/spender_duel/tests/` was present in the
# deploy gate but MISSING from the PR gate (Duel's engine + token-conservation
# soak only ran at deploy time, where a failure blocks the deploy instead of the
# commit). Add a new test package here, once.
#
# The listed order is core/ first (the shared platform every feature imports)
# and wwsd/ last — it installs the friend's deck into the shared engine globals
# at import time. **That order is now a READING order, not a run order**: under
# `-n auto` (below) tests are handed to workers as they free up, so nothing may
# DEPEND on it. This costs nothing, because the root conftest was already built
# to make the wwsd override order-independent rather than merely
# last-in-the-list — it snapshots the real deck at conftest import and restores
# after collection AND after every test, "in any test order", which is exactly
# the guarantee an arbitrary distribution needs. Each worker is its own process,
# so the override cannot cross between them either.
#
# THE SUITE RUNS IN PARALLEL BY DEFAULT. It is pure CPU (engines, soaks, bot
# playouts) in one process, so it was pinned to one core while the other three
# idled: 6m41s wall against 6m23s of user time. `-n auto` is a straight ~3x on a
# 4-core box and needs no test changes — every DB test already takes a `tmp_path`
# or `:memory:`, the WS throttle is per-process (so workers SPLIT the budget
# rather than contend for it), and the root conftest's deck restore is per-test
# and order-independent by construction, which is what makes an arbitrary
# distribution safe.
#
# `-n0` turns it off — use it for `--pdb`, for live output, or when a failure
# looks order-dependent and you want the deterministic serial order back.
# pytest-xdist is therefore a REQUIRED dependency, not a nicety: without it
# pytest exits on the unrecognised `-n`. See games/spender/requirements.txt.
addopts = -n auto

testpaths =
    core/tests
    shared/tests
    games/spender/tests
    books/tests
    games/castles_of_crimson/tests
    games/wherewolf/tests
    games/spender_duel/tests
    games/dontminion/tests
    games/dissonance/tests
    games/rag_tag/tests
    games/orbit/tests
    games/black_castle/tests
    wwsd/tests

# Offline AI research code lives under games/spender/ai/offline/ and is never
# imported by the server; it holds a `policy_arch_test.py` that is a probe
# script, not a suite member. Default discovery (`test_*.py`) already skips it.
python_files = test_*.py
