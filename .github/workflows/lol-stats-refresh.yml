name: LoL Stats refresh

# Re-downloads Oracle's Elixir match data and rebuilds LoL Stats' champion payload
# (webapp/public/data/lol-champs-<year>.json + the index), then commits it to main.
#
# Monthly on the 15th, January through November: the pro season runs from January to
# Worlds (2026's final: Nov 14), and nothing is played in December. A scheduled run
# rebuilds the current year; January's also rebuilds the year before, which picks up
# the games played after November's run. Oracle's Elixir posts a year's file with its
# first games, so a January run before that skips the new year rather than failing.
# "Run workflow" rebuilds any years named (blank = the current year).
#
# The Worlds seeds tab (lol-worlds.json) is lol-worlds.yml, from Liquipedia.
#
# A push made with GITHUB_TOKEN does not trigger other workflows, so the job
# dispatches the Pages deploy itself once the data is on main.

#
# THE DATA STORE (data-worker/, root CLAUDE.md "THE DATA STORE"): with vars.DATA_URL set
# this job starts from the store's copy of what it builds on, uploads what it changed,
# and the pages read it from there. vars.DATA_COMMITS=off stops the commit + deploy.
#
# THE 17th AND 20th ARE RETRIES, and do nothing once the month's refresh has landed.
# Google Drive caps downloads of one file per day, and the 15th can be the busiest day
# of that file's year: 2026-11-15 was the morning after the Worlds final, and every
# request got Drive's "Quota exceeded" page (harvest.py exits 75 for it). The cap resets
# on its own, so a run that meets it stays GREEN while a later retry is scheduled, and
# only the 20th's, the last chance that month, goes red. A run by hand always fails on it.
on:
  schedule:
    - cron: "23 10 15,17,20 1-11 *"
  workflow_dispatch:
    inputs:
      years:
        description: 'Years to rebuild, space-separated (blank = the current year)'
        default: ''

permissions:
  contents: write
  actions: write

concurrency:
  group: lol-stats-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      # The input reaches the shell through env, never pasted into the script.
      # The data store's copy is what the build must start from (data-worker/datastore.py).
      - name: Take the published files
        env:
          DATA_URL: ${{ vars.DATA_URL }}
        run: python data-worker/datastore.py take-lol
      # A retry day (17th/20th) whose month already has a build from the 15th on: done.
      # `built` is the date of the rebuild, read off the index the step above took.
      - name: Due
        id: due
        env:
          EVENT: ${{ github.event_name }}
        run: python -I lolstats/tools/refresh_due.py
      - name: Download
        id: download
        if: steps.due.outputs.due == 'true'
        env:
          YEARS: ${{ inputs.years }}
          EVENT: ${{ github.event_name }}
        run: |
          y=$(date -u +%Y)
          set +e
          if [ -n "$YEARS" ]; then python -I lolstats/tools/harvest.py $YEARS
          elif [ "$(date -u +%m)" = 01 ]; then python -I lolstats/tools/harvest.py --skip-missing $((y - 1)) $y
          else python -I lolstats/tools/harvest.py $y
          fi
          code=$?
          set -e
          if [ "$code" = 75 ] && [ "$EVENT" = schedule ] && [ "$(date -u +%-d)" -lt 20 ]; then
            echo "::warning::Google Drive's download quota is used up; the next scheduled retry (17th / 20th) will try again"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          exit "$code"
      # Every CSV downloaded above, and only those (the runner starts with none).
      - name: Build the payload
        if: steps.due.outputs.due == 'true' && steps.download.outputs.skip != 'true'
        run: python -I lolstats/tools/make_data.py
      - name: Publish to the data store
        if: steps.due.outputs.due == 'true' && steps.download.outputs.skip != 'true'
        env:
          DATA_URL: ${{ vars.DATA_URL }}
          DATA_PUBLISH_TOKEN: ${{ secrets.DATA_PUBLISH_TOKEN }}
        run: python data-worker/datastore.py publish $(cd webapp/public/data && ls lol-champs-*.json)
      - name: Commit and deploy
        if: vars.DATA_COMMITS != 'off' && steps.due.outputs.due == 'true' && steps.download.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add webapp/public/data/lol-champs-*.json
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "LoL Stats: refresh $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push origin HEAD:main
          gh workflow run deploy-pages.yml --ref main
