name: Steam Filter harvest

# Re-collects webapp/public/data/steam-filter.json from the Steam store and
# commits it to main.
#
# Every Friday, and the day of the month picks the mode:
#   - the first Friday: FULL — every review re-read (~7h, chained over up to three
#     runs). New releases cross the review floor and scores drift across 90% slowly,
#     so once a month is enough. It enriches too.
#   - every other Friday: ENRICH — categories and the Switch mark only (~5 min).
#     The eShop's new releases land mostly on Thursdays, and a Steam game that
#     reaches Switch is neither marked nor priced there until this runs.
# One cron, not two, so the two modes can never be queued together: a pending run
# in this concurrency group would cancel a full harvest's pending next round.
# An enrich that moves nothing leaves the file alone, so it commits and deploys nothing.
#
# A push made with GITHUB_TOKEN does not trigger other workflows, so the job
# dispatches the Pages deploy itself once the data is on main.

#
# THE DATA STORE (data-worker/, root CLAUDE.md "THE DATA STORE"): with vars.DATA_URL set
# this job starts from the store's copy of what it builds on, uploads what it changed,
# and the pages read it from there. vars.DATA_COMMITS=off stops the commit + deploy.
on:
  schedule:
    - cron: "13 9 * * 5"
  workflow_dispatch:
    inputs:
      mode:
        description: 'full = re-collect every review (~7h); enrich = only re-apply categories + Switch (~5 min)'
        type: choice
        options: [full, enrich]
        default: full
      min_reviews:
        description: 'English-review floor for the dataset'
        default: '50'
      round:
        description: 'Continuation round (set by the workflow itself; leave at 1)'
        default: '1'

permissions:
  contents: write
  actions: write

concurrency:
  group: steam-harvest
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      # A scheduled run has no inputs: full in the month's first week, else enrich.
      - name: Mode
        id: mode
        env:
          MODE: ${{ inputs.mode }}
          MIN: ${{ inputs.min_reviews }}
          ROUND: ${{ inputs.round }}
        run: |
          if [ -z "$MODE" ]; then
            if [ "$(date -u +%-d)" -le 7 ]; then MODE=full; else MODE=enrich; fi
          fi
          { echo "mode=$MODE"; echo "min=${MIN:-50}"; echo "round=${ROUND:-1}"; } >> "$GITHUB_OUTPUT"
          echo "mode=$MODE min_reviews=${MIN:-50} round=${ROUND:-1}"
      # Every Steam answer is cached as it arrives, and the cache is saved even when
      # the harvest fails or hits its step timeout, so "Run workflow" again resumes
      # where the last run stopped (answers younger than 48h are reused).
      # The data store's copy is what the build must start from (data-worker/datastore.py).
      - name: Take the published files
        env:
          DATA_URL: ${{ vars.DATA_URL }}
        run: python data-worker/datastore.py take steam-filter.json
      - uses: actions/cache/restore@v4
        if: steps.mode.outputs.mode == 'full'
        with:
          path: steamfilter/tools/cache
          key: steam-harvest-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: steam-harvest-
      - name: Harvest
        id: harvest
        # A step timeout, not the job's: the job must outlive it to save the cache.
        # Measured 2026-10-15: search ~68 min (132k games), then ~60 review lookups a
        # minute against ~22k candidates — ~7h in all, more than one job may run.
        timeout-minutes: 320
        run: python -u steamfilter/tools/scan_steam.py --min-reviews "${{ steps.mode.outputs.min }}" ${{ steps.mode.outputs.mode == 'enrich' && '--enrich' || '' }}
      - uses: actions/cache/save@v4
        if: always() && steps.mode.outputs.mode == 'full'
        with:
          path: steamfilter/tools/cache
          key: steam-harvest-${{ github.run_id }}-${{ github.run_attempt }}
      # Out of time (or a transient failure): the cache is saved above, so start the
      # next round, which reuses every answer already collected. Capped at 3 rounds.
      - name: Continue in a new run
        if: always() && steps.mode.outputs.mode == 'full' && steps.harvest.outcome != 'success' && fromJSON(steps.mode.outputs.round) < 3
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run steam-harvest.yml --ref main -f mode=full \
            -f min_reviews="${{ steps.mode.outputs.min }}" -f round="$(( ${{ steps.mode.outputs.round }} + 1 ))"
      - name: Build the payload
        run: python steamfilter/tools/make_data.py
      - name: Publish to the data store
        env:
          DATA_URL: ${{ vars.DATA_URL }}
          DATA_PUBLISH_TOKEN: ${{ secrets.DATA_PUBLISH_TOKEN }}
        run: python data-worker/datastore.py publish steam-filter.json
      - name: Commit and deploy
        if: vars.DATA_COMMITS != 'off'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add webapp/public/data/steam-filter.json
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "Steam Filter: ${{ steps.mode.outputs.mode == 'enrich' && 'categories + Switch' || 'harvest' }} $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push origin HEAD:main
          gh workflow run deploy-pages.yml --ref main
