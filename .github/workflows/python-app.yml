name: Python CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r games/spender/requirements.txt
      - name: Run tests
        # Bare pytest — the suite is defined by `testpaths` in pytest.ini. This
        # list used to omit games/spender_duel/tests/ (present in the Render
        # deploy gate), so Duel's tests never ran on a push or PR.
        run: |
          set -o pipefail
          python -m pytest -q -rf 2>&1 | tee "$RUNNER_TEMP/pytest.log"

      # A red suite here is often one a dev box cannot reproduce — this runner is
      # Linux on Python 3.11 while local work happens on Windows on 3.14 — and the
      # job log needs repository ADMIN to download through the API. The step
      # summary is part of the check run's public output, so putting the failing
      # tail here is the difference between diagnosing a break and guessing at it.
      - name: Report the failures
        if: failure()
        run: |
          {
            echo '### Failing tests'
            echo '```'
            grep -E '^(FAILED|ERROR)' "$RUNNER_TEMP/pytest.log" | head -40 || true
            echo '```'
            echo '<details><summary>Last 80 lines</summary>'
            echo
            echo '```'
            tail -80 "$RUNNER_TEMP/pytest.log"
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"
