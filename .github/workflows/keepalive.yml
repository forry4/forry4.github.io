name: Keep backend warm

# Keeps the Render free-tier backend warm during play hours so its cold start (~50s;
# spins down after ~15 min idle) doesn't hit real users. Public repo => free minutes.
#
# THIS IS NO LONGER THE SOLE MECHANISM, and that is the point — see the 2026-09-06
# measurement below for why one scheduler was never enough. `keepalive-worker/` is a
# Cloudflare Worker cron doing the same job on a different provider, and the two cover
# opposite halves: it fires reliably every 5 minutes, so the box should never reach the
# 15-minute idle timeout at all; this one fires unreliably but HOLDS a retrying curl for
# ~90 min, which is what actually completes a wake once the box is already cold. Neither
# depends on an always-on machine. Keep both — dropping either leaves the failure the
# other one covers.
#
# ⚠ BOTH PINGERS SPEND THE SAME BUDGET: Render's free tier allows 750 INSTANCE-HOURS per
# month per workspace, shared across every free service, and running out SUSPENDS the
# service until the next month. Overlapping pingers cost nothing extra (the hours are
# counted on the service being up, not on who woke it), but WIDENING either one's window
# does. `core/tests/test_keepalive_budget.py` guards the Worker's side of that.
#
# THE ACTUAL FIX IS THE WAKE, NOT THE TIMING. The 7-9am outages were NOT "GitHub fired
# late" — they were a 30s pinger (cron-job.org) that could not hold a connection through
# the ~50s spin-up: it disconnected mid-wake, which ABORTS the spin-up (Render logged
# NOTHING for the 2h; the instance never booted). Each ping below instead HOLDS the
# connection open and RETRIES through the 503s (curl --retry-all-errors + long --max-time),
# exactly like a browser — which wakes the box in ~7s. So whenever ANY morning run fires,
# even 20 min late, it completes the wake. Worst case degrades from "2h dead" to "first
# player waits one normal ~50s cold start" — never a 2h outage again.
#
# RELIABILITY STRATEGY for GitHub's flaky scheduler (it delays/drops individual starts,
# worst at :00):
#   1. Several pre-7am starts at off-peak minutes -> at least one lands. They must be in
#      DIFFERENT HOURS to be independent of the failure that actually happens; see the
#      2026-09-06 measurement below for what "independent" cost when they were not.
#   2. Each run is LONG-LIVED (~90 min) so a single firing bridges 7am, and with
#      cancel-in-progress:false the runs chain back-to-back for continuous coverage.
#   3. Twice-hourly starts through the day re-trigger the chain so it stays warm to ~10pm.
#   4. The `warm-window-watchdog` job below FAILS if the morning ramp went dark, because
#      every previous instance of this bug was found by a player, not by the workflow.
#
# DST: 7am LOCAL = 14:00 UTC in summer (PDT) / 15:00 UTC in winter (PST). The early
# starts at 11:41-15:09 UTC + the ~90-min run length bridge 7am in BOTH seasons. The
# stay-warm window 14:00-05:59 UTC covers 7am-10pm PDT (and PST with <=1h overhang).
#
# A GITHUB-SIDE INCIDENT CAN SILENTLY DE-REGISTER THIS SCHEDULE, AND THE SYMPTOM IS
# HOUR-SHAPED, NOT A UNIFORM SLOWDOWN. On 2026-08-26 an Actions incident ("Actions jobs
# failed to start") left the 13:00-16:00 UTC triggers dead while every later hour kept
# firing and workflow_dispatch stayed fine — so the workflow looked alive (5-8 runs/day,
# all green) while the band holding ALL THREE pre-7am warm-ups fired ZERO times for nine
# days. Backend warm coverage went ~23h/day -> ~7h/day and the morning play window was
# cold every day; the only outward sign was the external monitor's 503s.
# THE FIX IS A PUSH THAT TOUCHES THIS FILE on the default branch — that re-registers the
# cron. It does NOT self-heal, and it deploys nothing (this path is in neither
# deploy-pages.yml's nor deploy-render.yml's filter).
# DIAGNOSE IT BY START HOUR, NEVER BY RUN COUNT OR CONCLUSION: histogram
# run_started_at from /actions/workflows/keepalive.yml/runs and compare against the cron
# hours below. A whole dead BAND is this bug; uniformly fewer runs is ordinary GitHub
# scheduler drift.
#
# ...AND RE-REGISTERING IS NOT A FIX — IT WAS TRIED (2026-09-04, 72bd097) AND THE BAND
# STAYED DEAD. Measured 2026-09-06 over the 100 runs back to 08-25: UTC hours 13 and 14
# fired **0 times in the 11 days since 08-27**, against 2 and 4 firings in the two days
# before it, while hours 17 and 23 fired 20 and 14 times. The two mornings AFTER the
# re-registration push were still dead (first daytime firing 16:48 and 15:54 UTC, i.e.
# 09:48 and 08:54 local). Simulating the concurrency queue over those runs puts real warm
# coverage at **39%** (112h of 287h), with a cold window EVERY morning from 06:00 local
# until ~09:00-10:00 — which is exactly the "slow startup" a player reports.
#
# So the schedule below no longer assumes any particular cron will be honoured. Two
# changes, and the reasoning is what matters if this ever needs revisiting:
#   1. THE MORNING RAMP IS SPREAD ACROSS FIVE UTC HOURS (11,12,12,13,14,15), because the
#      observed failure looked HOUR-shaped. The old three "independent" attempts were all
#      inside 13:00-14:59, so they were independent of GitHub dropping ANY SINGLE start
#      and perfectly correlated with the failure that actually happens.
#   2. THE STAY-WARM BAND FIRES TWICE AN HOUR (:13 and :47) instead of once, so a 90-min
#      window gets three chances to keep the chain alive instead of one.
# Both minutes stay off :00, which is GitHub's own advice (the scheduler is worst at the
# top of the hour).
#
# ⚠ MEASURED 2026-09-09, AND HALF OF THAT REASONING WAS WRONG. Over the 41h after the new
# schedule landed: firings went 8-9/day -> **19.2/day** and coverage 39% -> **67%**, so the
# DENSITY half worked. The RAMP half did not — UTC hours 11, 12, 13 and 14 fired **zero**
# times, i.e. every one of the six morning crons, and 7am local was COLD on both mornings.
#
# THE MECHANISM IS NOT A DEAD BAND, IT IS A SYSTEMATIC MULTI-HOUR DELAY, and that is why
# spreading the ramp could not have worked. The watchdog below is gated on the crons at
# 17:47 and 21:13 UTC; its four runs were created at 20:46, 23:27, 20:17 and 23:21 — every
# one **2-3 hours late**. The crons fire; GitHub delivers them hours after the fact. So a
# "pre-7am warm-up" is unreachable on GitHub Actions AT ANY CRON TIME: by the time the run
# lands it is mid-morning. **Density is the only lever this scheduler actually offers** —
# which is exactly the half that improved.
# The ramp crons are KEPT because their late deliveries still add density, but do not read
# them as covering the morning: nothing on GitHub does. `keepalive-worker/` is the only
# mechanism that fires on time, and it is therefore the only thing covering 7am.

on:
  schedule:
    # ── the pre-7am ramp: six starts, five different UTC hours ──────────────────
    - cron: "41 11 * * *"          # 04:41 PDT — first warm-up, holds to 13:11 UTC
    - cron: "19 12 * * *"          # 05:19 PDT
    - cron: "53 12 * * *"          # 05:53 PDT — holds past 14:00 UTC, so it alone makes 7am PDT
    - cron: "29 13 * * *"          # 06:29 PDT — likewise
    - cron: "11 14 * * *"          # 07:11 PDT / 06:11 PST
    - cron: "9 15 * * *"           # 08:09 PDT / 07:09 PST — the PST 7am warm-up
    # ── stay warm through the play window (7am-10pm local), twice an hour ───────
    # Two of these hours are carved out into entries of their own so the watchdog job
    # below can be gated on them: `github.event.schedule` reports the cron EXPRESSION
    # that fired, never the time, so nothing inside a `14-23` range can tell 17:47
    # from 18:47. Gating on the range instead would start the watchdog on all twenty
    # firings a day; splitting the hour out costs one line and starts it on one.
    - cron: "13 15-20,22-23,0-4 * * *"
    - cron: "13 21 * * *"          # ...and wakes the watchdog
    - cron: "47 14-16,18-23,0-4 * * *"
    - cron: "47 17 * * *"          # ...and wakes the watchdog
  workflow_dispatch: {}

jobs:
  ping:
    # CONCURRENCY IS PER-JOB, NOT PER-WORKFLOW, and that is deliberate: at workflow level
    # it also serialises the watchdog below, so the one job whose whole purpose is to
    # report on the schedule would sit pending behind a 90-minute ping — or be cancelled
    # as a superseded pending run — and report nothing.
    concurrency:
      group: keepalive
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 95
    steps:
      # THE DELAY SPENDS BUDGET AT 1AM. Because GitHub delivers these runs 2-3 hours after
      # their cron time, a stay-warm start meant for the evening lands in the small hours:
      # measured 2026-09-07, two runs were created at 08:16 and 08:38 UTC — 01:16 and 01:38
      # LOCAL — and each held the backend up for 92 minutes for nobody. That is not free.
      # Render's free tier allows 750 instance-hours a month per workspace and running out
      # SUSPENDS the service until the next month, so hours burned at 1am are hours the
      # evening might not have. The cron cannot control when a run lands; the run itself
      # can, so the window is enforced HERE, on the wall clock, the same way the Worker
      # does it. 07:00-11:59 UTC is 00:00-04:59 local — the one stretch with no play in it.
      # 12:xx is deliberately allowed through: its 92-minute hold reaches past 13:30 UTC,
      # which is real pre-7am coverage.
      - name: Skip if this run landed in the small hours
        id: window
        run: |
          h=$(date -u +%H)
          if [ "$((10#$h))" -ge 7 ] && [ "$((10#$h))" -le 11 ]; then
            echo "delivered at ${h}:xx UTC ($(( (10#$h - 7 + 24) % 24 )):xx local) — inside the"
            echo "quiet window, so warming now would spend instance-hours nobody is playing in."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Warm + hold the backend for ~90 min
        if: steps.window.outputs.skip != 'true'
        run: |
          url="https://splendid-nelz.onrender.com/health"
          end=$(( $(date +%s) + 5400 ))   # ~90 min
          while [ "$(date +%s)" -lt "$end" ]; do
            # HOLD one connection open through the cold start (Render holds the request
            # while spinning up, then serves 200) and RETRY through 503s — like a browser.
            # A held+retrying curl completes the wake that a 30s pinger aborts.
            # --max-time bounds the whole retrying op; --retry-all-errors treats 503 as
            # retryable so it hammers a stalled wake instead of giving up.
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              --max-time 160 --retry 10 --retry-delay 8 --retry-all-errors "$url" || echo 000)
            echo "$(date -u +%H:%M:%SZ) -> HTTP $code"
            # Warm -> relax to a 4-min stay-warm cadence; still cold -> retry fast.
            if [ "$code" = "200" ]; then sleep 240; else sleep 15; fi
          done


  # THE ALARM. A morning with no warm-up is SILENT — the later hours keep firing, every run
  # is green, and only the 7am player notices — so it went unnoticed for nine days in August
  # and eleven more in September.
  #
  # ⚠ IT USED TO AUDIT THE WRONG THING, AND THAT IS THE LESSON WORTH KEEPING. The first
  # version asked "did a cron fire in 11:00-13:59 UTC?". Under the 2-3 hour delivery delay
  # measured above, that can essentially never be true whatever crons this file declares, so
  # it was a **permanently-red alarm** — and an alarm that cannot go green is worse than none,
  # because it trains the reader to ignore it. It also audited the wrong MECHANISM: with two
  # pingers by design, GitHub's cron timing does not determine whether the morning was warm.
  # Only `keepalive-worker/` fires on time, so only the Worker can cover 7am.
  #
  # So this asks the one question that decides the morning and that CAN go green: **is the
  # Cloudflare Worker deployed and answering?** Red means the morning is uncovered and names
  # the one command that fixes it; green means the mechanism that covers 7am is alive.
  # It deliberately does NOT try to confirm the box was warm AT 7am — nothing on GitHub runs
  # then to observe it, and inventing a proxy for that is how the previous version went wrong.
  #
  # It runs on TWO crons in different hours so one delayed or dropped delivery does not
  # silence it, and it pings the backend not at all: the Worker's own status endpoint answers
  # without warming anything outside its window.
  warm-window-watchdog:
    if: >-
      github.event_name == 'workflow_dispatch'
      || github.event.schedule == '47 17 * * *'
      || github.event.schedule == '13 21 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: The Cloudflare keepalive Worker must be deployed and answering
        env:
          # Override in repo Settings -> Secrets and variables -> Actions -> Variables if the
          # Worker is ever renamed or moved to a custom domain. The default is this account's
          # workers.dev subdomain, the same one the staging mirror uses.
          WORKER_URL: ${{ vars.KEEPALIVE_WORKER_URL || 'https://forrestgames-keepalive.forry4.workers.dev/' }}
        run: |
          set -uo pipefail
          echo "probing $WORKER_URL"
          body=$(curl -sS --max-time 30 --retry 2 --retry-all-errors -w '\n%{http_code}' "$WORKER_URL" 2>&1) || true
          code=$(printf '%s' "$body" | tail -n1)
          payload=$(printf '%s' "$body" | sed '$d')
          echo "HTTP $code"
          echo "$payload" | head -c 800
          echo
          # The Worker answers JSON carrying `warming` in both branches (inside its warm
          # window and outside it). Requiring that key, not just a 200, is what tells OUR
          # Worker apart from a parked page or someone else's route on the same subdomain.
          if [ "$code" = "200" ] && printf '%s' "$payload" | jq -e 'has("warming")' >/dev/null 2>&1; then
            echo "Worker is live — the 7am window has a mechanism covering it."
            exit 0
          fi
          echo "::error::The Cloudflare keepalive Worker is not answering at $WORKER_URL (HTTP $code)."
          echo "::error::GitHub Actions CANNOT cover the morning — its scheduled runs are delivered"
          echo "::error::2-3 hours late (see this file's header), so 7am is uncovered without the Worker."
          echo "::error::Deploy it:  npx wrangler deploy --config keepalive-worker/wrangler.jsonc"
          echo "::error::If it moved, set the KEEPALIVE_WORKER_URL repo variable to its new URL."
          exit 1
